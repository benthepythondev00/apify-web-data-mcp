name: Publish to the MCP Registry

on:
  workflow_dispatch:
    inputs:
      entry:
        description: Folder of one entry to publish (empty = all)
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: curl -sL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
      - name: Sign in with this repository's identity
        run: ./mcp-publisher login github-oidc
      - name: Publish every entry
        run: |
          for entry in ${{ inputs.entry || '*' }}/server.json; do
            (cd "$(dirname "$entry")" && ../mcp-publisher publish)
          done
